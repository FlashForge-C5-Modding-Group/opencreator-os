# nginx for the printer stack (docs/stack.md): the web interface in
# /data/printer/www, Moonraker's API and websocket proxied on port 80.
user root;
worker_processes 1;
pid /data/printer_data/nginx/nginx.pid;
error_log /data/printer_data/logs/nginx-error.log;

events {
	worker_connections 256;
}

http {
	include /data/printer/root/etc/nginx/mime.types;
	default_type application/octet-stream;
	access_log off;
	sendfile on;
	client_max_body_size 0;

	client_body_temp_path /data/printer_data/nginx/client_body;
	proxy_temp_path /data/printer_data/nginx/proxy;
	fastcgi_temp_path /data/printer_data/nginx/fastcgi;
	uwsgi_temp_path /data/printer_data/nginx/uwsgi;
	scgi_temp_path /data/printer_data/nginx/scgi;

	# large uploads outlast the 60 s defaults (opencreator-fs creator5-timeouts.conf)
	proxy_connect_timeout 600s;
	proxy_send_timeout 3600s;
	proxy_read_timeout 3600s;
	send_timeout 3600s;
	client_body_timeout 3600s;

	gzip on;
	gzip_vary on;
	gzip_proxied any;
	gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml image/svg+xml;

	map $http_upgrade $connection_upgrade {
		default upgrade;
		'' close;
	}

	upstream moonraker {
		server 127.0.0.1:7125;
	}

	server {
		listen 80 default_server;
		listen [::]:80 default_server;
		root /data/printer/www;
		index index.html;

		location / {
			try_files $uri $uri/ /index.html;
		}

		location = /index.html {
			add_header Cache-Control "no-store";
		}

		location /websocket {
			proxy_pass http://moonraker/websocket;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_set_header Host $http_host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		}

		location ~ ^/(printer|api|access|machine|server)/ {
			proxy_pass http://moonraker$request_uri;
			proxy_http_version 1.1;
			proxy_set_header Host $http_host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Scheme $scheme;
		}
	}
}
